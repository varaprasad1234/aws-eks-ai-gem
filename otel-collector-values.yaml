mode: deployment

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:

  exporters:
    prometheusremotewrite:
      endpoint: "http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090/api/v1/write"
    otlp/loki:
      endpoint: "http://loki-gateway.observability.svc.cluster.local:80/otlp"
      tls:
        insecure: true
    otlp/tempo:
      endpoint: "tempo-distributor.observability.svc.cluster.local:4317"
      tls:
        insecure: true

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/loki]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp/tempo]
